param_config_name: Weight all
temporal_resolution: 50.0
t_start: 3000.0
Surrogate:
  custom_training: dmosopt.model_transformer.joint
  kwargs:
    mode: c+o
    objectives: true
    constraints: false
    sensitivity: true
    feasibility_solving: true
    feasibility_targets: objective constraint
    feasibility_after: 10
    feasibility_iterations: 1000
    feasibility_max_move: 0.1
    feasibility_constraint_weights: {NGFC synchrony bound: 4, AAC synchrony bound: 4,
      IVY synchrony bound: 4}
Network Optimization:
  Features:
  - {class: miv_simulator.network_objectives.MeanFiringRateFeature}
  - {class: miv_simulator.network_objectives.PopulationFiringRateFeature}
  - {class: miv_simulator.network_objectives.FractionActiveFeature}
  - class: miv_simulator.network_objectives.FiringRateStabilityFeature
    kwargs:
      temporal_resolution: 2.0
      active_threshold: {AAC: 9.0, BS: 9.0, CCKBC: 4.5, IS1: 8.5, IS2: 8.5, IS3: 8.5,
        IVY: 1.5, NGFC: 3.7, OLM: 6.5, PVBC: 9.0, PYR: 0.51, SCA: 4.5}
  - class: miv_simulator.network_objectives.ParticipationRatioFeature
    kwargs: {bin_size: 50.0}
  Objectives:
  - class: miv_simulator.network_objectives.TargetLogRateObjective
    name: PYR population rate
    pop_name: PYR
    kwargs: {target_rate: 1.02}
  - class: miv_simulator.network_objectives.TargetLogRateObjective
    name: IVY population rate
    pop_name: IVY
    kwargs: {target_rate: 3.0}
  - class: miv_simulator.network_objectives.TargetLogRateObjective
    name: PVBC population rate
    pop_name: PVBC
    kwargs: {target_rate: 18.0}
  Constraints:
  - class: miv_simulator.network_objectives.FiringRateBoundConstraint
    name: AAC rate band
    pop_name: AAC
    kwargs: {feature: population_rate, min_rate: 4.5, max_rate: 72.0}
  - class: miv_simulator.network_objectives.ActiveFractionBoundConstraint
    name: AAC active per bin band
    pop_name: AAC
    kwargs: {feature: mean_fraction_active_per_bin, min_fraction: 0.46, max_fraction: 1.0}
  - class: miv_simulator.network_objectives.SteadyFiringConstraint
    name: AAC steady firing
    pop_name: AAC
    kwargs: {max_cv: 0.5}
  - class: miv_simulator.network_objectives.FiringRateBoundConstraint
    name: BS rate band
    pop_name: BS
    kwargs: {feature: population_rate, min_rate: 4.5, max_rate: 72.0}
  - class: miv_simulator.network_objectives.ActiveFractionBoundConstraint
    name: BS active per bin band
    pop_name: BS
    kwargs: {feature: mean_fraction_active_per_bin, min_fraction: 0.46, max_fraction: 1.0}
  - class: miv_simulator.network_objectives.SteadyFiringConstraint
    name: BS steady firing
    pop_name: BS
    kwargs: {max_cv: 0.5}
  - class: miv_simulator.network_objectives.FiringRateBoundConstraint
    name: CCKBC rate band
    pop_name: CCKBC
    kwargs: {feature: population_rate, min_rate: 2.25, max_rate: 36.0}
  - class: miv_simulator.network_objectives.ActiveFractionBoundConstraint
    name: CCKBC active per bin band
    pop_name: CCKBC
    kwargs: {feature: mean_fraction_active_per_bin, min_fraction: 0.45, max_fraction: 1.0}
  - class: miv_simulator.network_objectives.SteadyFiringConstraint
    name: CCKBC steady firing
    pop_name: CCKBC
    kwargs: {max_cv: 0.5}
  - class: miv_simulator.network_objectives.FiringRateBoundConstraint
    name: IS1 rate band
    pop_name: IS1
    kwargs: {feature: population_rate, min_rate: 4.25, max_rate: 68.0}
  - class: miv_simulator.network_objectives.SteadyFiringConstraint
    name: IS1 steady firing
    pop_name: IS1
